name: Publish macOS installer
on:
  push:
    branches: [main]
    paths: ['.release-parts/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-macos-installer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore and verify protected installer
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .release-parts/v1.0.1/manifest.json ]; then
            gh release view v1.0.1 --repo "$GITHUB_REPOSITORY"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('.release-parts/v1.0.1')
          manifest = json.loads((folder / 'manifest.json').read_text())
          output = Path('ETFQuantDashboard-1.0.1-AppleSilicon.dmg')
          with output.open('wb') as target:
              for part in manifest['parts']:
                  payload = (folder / part['name']).read_bytes()
                  assert len(payload) == part['size'], 'Part size mismatch'
                  assert hashlib.sha256(payload).hexdigest() == part['sha256'], 'Part checksum mismatch'
                  target.write(payload)
          assert output.stat().st_size == manifest['size'], 'Installer size mismatch'
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          assert digest == manifest['sha256'], 'Installer checksum mismatch'
          Path(str(output) + '.sha256').write_text(f'{digest}  {output.name}\n')
          print(f'Installer verified: {output.name} ({output.stat().st_size} bytes), SHA256 {digest}')
          PY
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: steps.restore.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.1 ETFQuantDashboard-1.0.1-AppleSilicon.dmg ETFQuantDashboard-1.0.1-AppleSilicon.dmg.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.1 ETFQuantDashboard-1.0.1-AppleSilicon.dmg ETFQuantDashboard-1.0.1-AppleSilicon.dmg.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ETF 量化看板 1.0.1 · Apple Silicon' --notes-file release-notes.md --latest
          fi
